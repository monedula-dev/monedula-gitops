apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: ingest
spec:
  clusterRef:
    name: host-scoped
  topicName: payments.ingest
  partitions: 6
  config:
    retention.ms: "604800000"
  access:
    producers:
      - principal: "User:svc-ingest"
        host: "10.0.0.0/8"
        operations:
          - Write
          - Describe
