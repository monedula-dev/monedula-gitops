apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
  namespace: team-a
spec:
  clusterRef:
    name: prod
  topicName: orders
  partitions: 3
  access:
    producers:
      - principal: User:svc-checkout
    consumers:
      - principal: User:svc-fulfillment
        group: fulfillment
