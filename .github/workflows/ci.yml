name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      # The release pipeline runs `go mod tidy` as a pre-hook, so an untidy
      # go.mod dirties the tree mid-release; catch it here instead.
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      # The README version table is generated from internal/matrix/versions.yaml.
      # A stale table means the documented support claim no longer matches what
      # CI actually runs — which is exactly how the previous claim went wrong.
      - name: README version matrix is current
        run: |
          make matrix-docs
          git diff --exit-code README.md
      # go>=1.26 gofmt rewrites paired apostrophes in doc comments into curly
      # quotes, corrupting CEL rules; see the guard comment in types.go.
      - name: forbid CEL empty-string literals in types.go
        run: |
          if grep -n "== ''" internal/api/v1alpha1/types.go; then
            echo "CEL empty-string literal reintroduced — see the guard comment in internal/api/v1alpha1/types.go (use .size() == 0)"
            exit 1
          fi
      # -race roughly 2-3x's runtime (acceptance suite alone is ~205s unraced);
      # no explicit timeout-minutes is set, so this runs under the GitHub-hosted
      # default job timeout (6h) with plenty of headroom.
      - run: go test -race ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # golangci-lint v2 requires action v7; v6 only supports the v1 line.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - run: helm lint charts/monedula-gitops
  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check
  # Renders internal/matrix/versions.yaml into job matrices. Using the project's
  # own loader (hack/matrix-cells) rather than yq keeps CI and the unit tests on
  # the same parser, so the two cannot disagree about what the file means.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.cells.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - id: cells
        run: |
          cells=$(go run ./hack/matrix-cells -tier=integration)
          echo "integration=$cells" >> "$GITHUB_OUTPUT"
  # Container-backed adapter tests, once per broker version the project claims to
  # support. Until this existed, `go test -race ./...` skipped every one of them:
  # they sit behind the `integration` build tag, so no container had ever started
  # in CI. See internal/matrix/versions.yaml for why these versions.
  integration-matrix:
    needs: matrix
    runs-on: ubuntu-latest
    # Generous headroom over the test step's own -timeout 25m: checkout, Go
    # setup, build, and multi-hundred-megabyte image pulls all happen before
    # that timeout starts counting. If the outer job timeout wins instead of
    # the inner one, `go test` never gets to print its goroutine dump, and a
    # hang becomes undiagnosable.
    timeout-minutes: 40
    strategy:
      # One broken broker version must not hide the results of the others.
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.matrix.outputs.integration) }}
    name: integration (${{ matrix.cell }})
    # `secrets` is not a valid context in a step-level `if` (GitHub's
    # jobs.<job_id>.steps.<step_id>.if only allows github, needs, strategy,
    # matrix, job, runner, env, vars, steps, inputs) — using it there fails
    # evaluation for the whole workflow file. `jobs.<job_id>.env` DOES allow
    # secrets, and step `if` DOES allow `env`, so hoist it here. Do not
    # "simplify" this back to `if: ${{ secrets.DOCKERHUB_USERNAME != '' }}`.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # Authenticated pulls when credentials exist: 7 cells x several images per
      # PR runs into Docker Hub's anonymous rate limit. The job still works
      # without the secrets — it just risks being throttled.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # -count=1 is required: the cell comes from an environment variable, which
      # go test's result cache does not track — a cached "ok" from another cell
      # would otherwise be reported as a pass for this one.
      - name: Integration tests
        run: go test -tags integration ./... -timeout 25m -count=1
        env:
          MONEDULA_MATRIX_CELL: ${{ matrix.cell }}
