name: release
on:
  push:
    tags:
    - 'v*'
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/monedula-dev/monedula-gitops
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest
    - id: build_date
      run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          COMMIT=${{ github.sha }}
          DATE=${{ steps.build_date.outputs.date }}
  chart:
    needs: image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
      with:
        version: v3.16.0
    - name: Lint
      run: helm lint charts/monedula-gitops
    - name: Template (sanity)
      run: helm template t charts/monedula-gitops --set webhook.enabled=true >/dev/null
    - name: Login to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Package
      run: |
        helm package charts/monedula-gitops \
          --version "${GITHUB_REF_NAME#v}" \
          --app-version "${GITHUB_REF_NAME#v}" \
          --destination dist/
        ls dist/monedula-gitops-*.tgz
    - name: Push
      run: |
        chart=$(ls dist/monedula-gitops-*.tgz)
        helm push "$chart" oci://ghcr.io/monedula-dev/charts
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    - uses: goreleaser/goreleaser-action@v6
      with:
        version: '~> v2'
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
