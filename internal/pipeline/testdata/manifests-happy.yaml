apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
  namespace: payments
spec:
  clusterRef:
    name: prod
  topicName: payments.orders
  partitions: 6
  access:
    producers:
      - principal: "User:checkout"
---
apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaAccessPolicy
metadata:
  name: ops-policy
spec:
  clusterRef:
    name: prod
  rules:
    - principal: "User:ops"
      resource:
        type: topic
        name: payments.orders
      operations:
        - Read
