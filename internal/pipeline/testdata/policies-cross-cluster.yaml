apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaAccessPolicy
metadata:
  name: allow-on-a
spec:
  clusterRef:
    name: a
  rules:
    - principal: "User:alice"
      permission: Allow
      resource:
        type: topic
        name: payments.orders
      operations:
        - Read
---
apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaAccessPolicy
metadata:
  name: deny-on-b
spec:
  clusterRef:
    name: b
  rules:
    - principal: "User:alice"
      permission: Deny
      resource:
        type: topic
        name: payments.orders
      operations:
        - Read
