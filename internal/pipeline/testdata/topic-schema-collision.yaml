apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: collision-orders
spec:
  clusterRef:
    name: sch
  topicName: payments.orders
  partitions: 1
  schema:
    format: AVRO
    subjectStrategy: RecordName
    valueSchema:
      valueFrom:
        inline: >-
          {"type":"record","name":"SameName","namespace":"com.acme","fields":[]}
    keySchema:
      valueFrom:
        inline: >-
          {"type":"record","name":"SameName","namespace":"com.acme","fields":[{"name":"id","type":"string"}]}
