apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaCluster
metadata:
  name: inline
spec:
  bootstrapServers: kafka.inline:9092
  defaults:
    replicationFactor: 2
---
apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: inline-topic
spec:
  clusterRef:
    name: inline
  partitions: 3
