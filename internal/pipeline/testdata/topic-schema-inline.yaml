apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
spec:
  clusterRef:
    name: sch
  topicName: payments.orders
  partitions: 1
  schema:
    format: AVRO
    compatibility: BACKWARD
    valueSchema:
      valueFrom:
        inline: '{"type":"record","name":"Order","namespace":"payments","fields":[{"name":"id","type":"string"},{"name":"amount","type":"long"}]}'
