# Schema Registry mock state for the schema-import test: the value subject for
# topic payments.orders is registered, so `import cluster` folds it into
# spec.schema and writes the schema file verbatim.
subjects:
  - subject: payments.orders-value
    type: AVRO
    compatibility: BACKWARD
    definition: |
      {
        "type": "record",
        "name": "Order",
        "namespace": "payments",
        "fields": [
          {"name": "id", "type": "string"},
          {"name": "amount", "type": "long"}
        ]
      }
