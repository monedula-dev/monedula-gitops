kind: KafkaCluster
metadata:
  name: dr
  annotations:
    gitops.monedula.dev/mock-state-file: mirror-live-state.yaml
    gitops.monedula.dev/mock-rest-file: mirror-progressing-rest.yaml
spec:
  bootstrapServers: localhost:9092
  rest:
    endpoint: https://broker-0.dr:8090/kafka
