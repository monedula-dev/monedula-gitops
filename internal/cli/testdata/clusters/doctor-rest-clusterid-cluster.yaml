# Destination cluster whose spec.rest configures clusterId: the rest check
# makes no request.
apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaCluster
metadata:
  name: dr
  annotations:
    gitops.monedula.dev/mock-state-file: mirror-state.yaml
    gitops.monedula.dev/mock-rest-file: mirror-rest.yaml
spec:
  bootstrapServers: localhost:9092
  rest:
    endpoint: https://broker-0.dr:8090/kafka
    clusterId: dr-cluster-id
