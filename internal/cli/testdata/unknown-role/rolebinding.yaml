apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaRoleBinding
metadata:
  name: alice-typo
  namespace: payments
spec:
  clusterRef:
    name: rbac-imp
  principal: "User:alice"
  role: DevoperWrite # typo of DeveloperWrite (spec §40: unknown role -> warn only)
  scope:
    type: kafka
  resources:
    - type: Topic
      name: payments.orders
      patternType: literal
