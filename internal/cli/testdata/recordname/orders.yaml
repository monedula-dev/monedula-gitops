apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
spec:
  clusterRef:
    name: rn
  topicName: payments.orders
  partitions: 1
  # RecordName strategy (spec §11): the value subject is the schema's record
  # full name (namespace + name = "payments.Order"), NOT "<topic>-value". The
  # SR mock is empty, so the desired subject is absent -> one RegisterSchema op
  # targeting "payments.Order".
  schema:
    format: AVRO
    subjectStrategy: RecordName
    compatibility: BACKWARD
    valueSchema:
      valueFrom:
        file: ./orders-value.avsc
