apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
spec:
  clusterRef:
    name: cg
  topicName: payments.orders
  partitions: 1
  # Custom strategy + governance mode (spec §11, §12.2): no valueSchema body —
  # monedula manages ONLY the compatibility level of an ARBITRARY subject named
  # verbatim via valueSubject. The producer registers versions out-of-band
  # (seeded), which is NOT drift. The only desired change is compatibility
  # convergence (BACKWARD -> FULL) on "my.custom.subject".
  schema:
    format: AVRO
    subjectStrategy: Custom
    compatibility: FULL
    valueSubject: my.custom.subject
