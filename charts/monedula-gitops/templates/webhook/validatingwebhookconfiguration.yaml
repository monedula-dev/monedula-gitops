{{- if .Values.webhook.enabled -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "monedula-gitops.fullname" . }}-validating-webhook-configuration
  labels:
    {{- include "monedula-gitops.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "monedula-gitops.fullname" . }}-webhook-cert
  {{- end }}
webhooks:
- name: vkafkatopic.gitops.monedula.dev
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  clientConfig:
    service:
      name: {{ include "monedula-gitops.fullname" . }}-webhook
      namespace: {{ .Release.Namespace }}
      path: /validate-gitops-monedula-dev-v1alpha1-kafkatopic
    {{- if not .Values.webhook.certManager.enabled }}
    caBundle: {{ required "webhook.caBundle is required when webhook.certManager.enabled=false" .Values.webhook.caBundle | quote }}
    {{- end }}
  rules:
  - apiGroups:
    - gitops.monedula.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - kafkatopics
- name: vkafkaquota.gitops.monedula.dev
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  clientConfig:
    service:
      name: {{ include "monedula-gitops.fullname" . }}-webhook
      namespace: {{ .Release.Namespace }}
      path: /validate-gitops-monedula-dev-v1alpha1-kafkaquota
    {{- if not .Values.webhook.certManager.enabled }}
    caBundle: {{ required "webhook.caBundle is required when webhook.certManager.enabled=false" .Values.webhook.caBundle | quote }}
    {{- end }}
  rules:
  - apiGroups:
    - gitops.monedula.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - kafkaquotas
- name: vkafkaaccesspolicy.gitops.monedula.dev
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  clientConfig:
    service:
      name: {{ include "monedula-gitops.fullname" . }}-webhook
      namespace: {{ .Release.Namespace }}
      path: /validate-gitops-monedula-dev-v1alpha1-kafkaaccesspolicy
    {{- if not .Values.webhook.certManager.enabled }}
    caBundle: {{ required "webhook.caBundle is required when webhook.certManager.enabled=false" .Values.webhook.caBundle | quote }}
    {{- end }}
  rules:
  - apiGroups:
    - gitops.monedula.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - kafkaaccesspolicies
- name: vkafkarolebinding.gitops.monedula.dev
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  clientConfig:
    service:
      name: {{ include "monedula-gitops.fullname" . }}-webhook
      namespace: {{ .Release.Namespace }}
      path: /validate-gitops-monedula-dev-v1alpha1-kafkarolebinding
    {{- if not .Values.webhook.certManager.enabled }}
    caBundle: {{ required "webhook.caBundle is required when webhook.certManager.enabled=false" .Values.webhook.caBundle | quote }}
    {{- end }}
  rules:
  - apiGroups:
    - gitops.monedula.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - kafkarolebindings
- name: vkafkauser.gitops.monedula.dev
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  clientConfig:
    service:
      name: {{ include "monedula-gitops.fullname" . }}-webhook
      namespace: {{ .Release.Namespace }}
      path: /validate-gitops-monedula-dev-v1alpha1-kafkauser
    {{- if not .Values.webhook.certManager.enabled }}
    caBundle: {{ required "webhook.caBundle is required when webhook.certManager.enabled=false" .Values.webhook.caBundle | quote }}
    {{- end }}
  rules:
  - apiGroups:
    - gitops.monedula.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - kafkausers
{{- end }}
