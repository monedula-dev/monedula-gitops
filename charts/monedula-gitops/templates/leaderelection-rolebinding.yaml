{{- if and .Values.rbac.create .Values.leaderElection.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "monedula-gitops.fullname" . }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monedula-gitops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "monedula-gitops.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "monedula-gitops.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
