{{- /* Namespaced Secret access (rbac.secretNamespaces): replaces the ClusterRole's
       cluster-wide Secret rule with a Role + RoleBinding per listed namespace. Verbs
       mirror the ClusterRole's Secret rule (config/rbac/role.yaml). */ -}}
{{- if .Values.rbac.create }}
{{- range .Values.rbac.secretNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "monedula-gitops.fullname" $ }}-secrets
  namespace: {{ . }}
  labels:
    {{- include "monedula-gitops.labels" $ | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "monedula-gitops.fullname" $ }}-secrets
  namespace: {{ . }}
  labels:
    {{- include "monedula-gitops.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "monedula-gitops.fullname" $ }}-secrets
subjects:
- kind: ServiceAccount
  name: {{ include "monedula-gitops.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
