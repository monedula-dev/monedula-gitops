{{- if .Values.crds.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: kafkamirrortopics.gitops.monedula.dev
spec:
  group: gitops.monedula.dev
  names:
    kind: KafkaMirrorTopic
    listKind: KafkaMirrorTopicList
    plural: kafkamirrortopics
    singular: kafkamirrortopic
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .spec.linkName
      name: Link
      type: string
    - jsonPath: .spec.sourceTopicName
      name: Source
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.observedMirrorStatus
      name: Mirror
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KafkaMirrorTopicSpec declares a cluster-link mirror topic. Identity fields are
              immutable at the API server via CEL transition rules; an empty explicit
              topicName is treated as omitted (the effective name is sourceTopicName).
            properties:
              clusterRef:
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              config:
                additionalProperties:
                  type: string
                type: object
              deletionPolicy:
                description: |-
                  DeletionPolicy is present only so that Delete is rejected: without the
                  field the API server would silently prune an unknown deletionPolicy.
                  Mirror topics are always orphaned on delete.
                enum:
                - Orphan
                type: string
              linkName:
                type: string
              reconciliation:
                properties:
                  mode:
                    enum:
                    - Enforce
                    - DetectOnly
                    - ObserveOnly
                    type: string
                type: object
              replicationFactor:
                minimum: 1
                type: integer
              sourceTopicName:
                type: string
              topicName:
                description: TopicName is the destination topic name; empty means
                  sourceTopicName.
                type: string
            required:
            - clusterRef
            - linkName
            - sourceTopicName
            type: object
            x-kubernetes-validations:
            - message: spec.clusterRef.name is immutable
              rule: self.clusterRef.name == oldSelf.clusterRef.name
            - message: spec.linkName is immutable
              rule: self.linkName == oldSelf.linkName
            - message: spec.sourceTopicName is immutable
              rule: self.sourceTopicName == oldSelf.sourceTopicName
            - message: the effective destination topic name is immutable (a different
                name needs a new KafkaMirrorTopic)
              rule: '((has(oldSelf.topicName) && oldSelf.topicName != '''') ? oldSelf.topicName
                : oldSelf.sourceTopicName) == ((has(self.topicName) && self.topicName
                != '''') ? self.topicName : self.sourceTopicName)'
          status:
            description: KafkaMirrorTopicStatus is the observed state of a KafkaMirrorTopic.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              drift:
                properties:
                  detected:
                    type: boolean
                  fields:
                    items:
                      type: string
                    type: array
                required:
                - detected
                type: object
              lastAppliedTime:
                format: date-time
                type: string
              lastCheckedTime:
                format: date-time
                type: string
              lastObservedStatusChangeTime:
                format: date-time
                type: string
              linkName:
                type: string
              observedGeneration:
                format: int64
                type: integer
              observedMirrorStatus:
                type: string
              phase:
                type: string
              sourceTopicName:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
