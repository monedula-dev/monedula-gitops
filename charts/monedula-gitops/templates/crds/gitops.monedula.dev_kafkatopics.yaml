{{- if .Values.crds.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: kafkatopics.gitops.monedula.dev
spec:
  group: gitops.monedula.dev
  names:
    kind: KafkaTopic
    listKind: KafkaTopicList
    plural: kafkatopics
    singular: kafkatopic
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KafkaTopicSpec carries CEL transition rules (x-kubernetes-validations) that
              enforce identity immutability AT THE APISERVER, so the default install
              (webhooks disabled) cannot silently orphan broker state by renaming identity
              fields. The rules reference oldSelf, so they run only on UPDATE — create is
              unrestricted. topicName is immutable ONCE SET: an update from unset/empty to
              set is allowed (defaulting resolves topicName from metadata.name in-memory,
              so making the default explicit later must not be rejected). Note the CEL rule
              cannot compare against metadata.name from spec scope, so unset→set admits any
              value; the webhook (when enabled) additionally rejects an unset→set update
              whose value differs from metadata.name (resolved-name comparison). The
              !has() disjunct is defensive for a future pointer/optional refactor of
              TopicName; today the field is a plain string, so the .size() == 0 disjunct
              is what fires for never-set values. CEL messages are static (no old/new
              value interpolation) — the webhook supplies the richer old -> new messages.
            properties:
              access:
                properties:
                  consumers:
                    items:
                      properties:
                        group:
                          type: string
                        groupOperations:
                          items:
                            type: string
                          type: array
                        host:
                          description: Host restricts the topic+group ACLs to a source
                            host (default "*" = all hosts). Spec §8.4.
                          type: string
                        principal:
                          type: string
                        topicOperations:
                          items:
                            type: string
                          type: array
                      required:
                      - group
                      - principal
                      type: object
                    type: array
                  producers:
                    items:
                      properties:
                        host:
                          description: Host restricts the ACL to a source host (default
                            "*" = all hosts). Spec §8.4.
                          type: string
                        operations:
                          items:
                            type: string
                          type: array
                        principal:
                          type: string
                      required:
                      - principal
                      type: object
                    type: array
                type: object
              clusterRef:
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              config:
                additionalProperties:
                  type: string
                type: object
              deletionPolicy:
                enum:
                - Orphan
                - Delete
                type: string
              drift:
                properties:
                  ignoreFields:
                    items:
                      type: string
                    type: array
                type: object
              partitions:
                minimum: 1
                type: integer
              prune:
                description: |-
                  Prune opts this resource's managed ACL scope into pruning (spec §10.3):
                  in-scope live ACLs no longer desired are deleted only when every
                  resource whose scope covers them sets prune: true. Default false —
                  prune candidates are reported as drift but never deleted.
                type: boolean
              reconciliation:
                properties:
                  mode:
                    enum:
                    - Enforce
                    - DetectOnly
                    - ObserveOnly
                    type: string
                type: object
              replicationFactor:
                minimum: 1
                type: integer
              schema:
                properties:
                  compatibility:
                    enum:
                    - NONE
                    - BACKWARD
                    - BACKWARD_TRANSITIVE
                    - FORWARD
                    - FORWARD_TRANSITIVE
                    - FULL
                    - FULL_TRANSITIVE
                    type: string
                  format:
                    enum:
                    - AVRO
                    - JSON
                    - PROTOBUF
                    type: string
                  keySchema:
                    properties:
                      valueFrom:
                        properties:
                          configMapKeyRef:
                            description: |-
                              ConfigMapKeyRef reads a ConfigMap key (operator mode only).
                              Uses the same {Name, Key} shape as SecretKeyRef; no Secret is involved.
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          env:
                            type: string
                          file:
                            type: string
                          inline:
                            description: Inline is the literal value verbatim (intended
                              for schema bodies).
                            type: string
                          secretKeyRef:
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        type: object
                    required:
                    - valueFrom
                    type: object
                  keySubject:
                    description: KeySubject names the key schema subject verbatim
                      when SubjectStrategy is Custom.
                    type: string
                  subjectStrategy:
                    enum:
                    - TopicName
                    - RecordName
                    - TopicRecordName
                    - Custom
                    type: string
                  valueSchema:
                    properties:
                      valueFrom:
                        properties:
                          configMapKeyRef:
                            description: |-
                              ConfigMapKeyRef reads a ConfigMap key (operator mode only).
                              Uses the same {Name, Key} shape as SecretKeyRef; no Secret is involved.
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          env:
                            type: string
                          file:
                            type: string
                          inline:
                            description: Inline is the literal value verbatim (intended
                              for schema bodies).
                            type: string
                          secretKeyRef:
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        type: object
                    required:
                    - valueFrom
                    type: object
                  valueSubject:
                    description: ValueSubject names the value schema subject verbatim
                      when SubjectStrategy is Custom.
                    type: string
                required:
                - format
                type: object
              topicName:
                type: string
            required:
            - clusterRef
            - partitions
            type: object
            x-kubernetes-validations:
            - message: spec.topicName is immutable once set (a rename is a delete
                + create of a different Kafka topic)
              rule: '!has(oldSelf.topicName) || oldSelf.topicName.size() == 0 || (has(self.topicName)
                && self.topicName == oldSelf.topicName)'
            - message: spec.clusterRef.name is immutable (repointing a topic orphans
                state on the previous cluster)
              rule: self.clusterRef.name == oldSelf.clusterRef.name
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              drift:
                properties:
                  detected:
                    type: boolean
                  fields:
                    items:
                      type: string
                    type: array
                required:
                - detected
                type: object
              lastAppliedTime:
                format: date-time
                type: string
              lastCheckedTime:
                format: date-time
                type: string
              observedAccess:
                properties:
                  consumers:
                    items:
                      properties:
                        group:
                          type: string
                        groupOperations:
                          items:
                            type: string
                          type: array
                        host:
                          description: Host restricts the topic+group ACLs to a source
                            host (default "*" = all hosts). Spec §8.4.
                          type: string
                        principal:
                          type: string
                        topicOperations:
                          items:
                            type: string
                          type: array
                      required:
                      - group
                      - principal
                      type: object
                    type: array
                  producers:
                    items:
                      properties:
                        host:
                          description: Host restricts the ACL to a source host (default
                            "*" = all hosts). Spec §8.4.
                          type: string
                        operations:
                          items:
                            type: string
                          type: array
                        principal:
                          type: string
                      required:
                      - principal
                      type: object
                    type: array
                type: object
              observedGeneration:
                format: int64
                type: integer
              observedTopic:
                properties:
                  config:
                    additionalProperties:
                      type: string
                    type: object
                  partitions:
                    type: integer
                  replicationFactor:
                    type: integer
                  topicName:
                    type: string
                type: object
              phase:
                type: string
              schema:
                properties:
                  compatibility:
                    type: string
                  valueSchemaId:
                    type: integer
                  valueSubject:
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
