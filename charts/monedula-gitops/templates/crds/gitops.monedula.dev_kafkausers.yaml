{{- if .Values.crds.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: kafkausers.gitops.monedula.dev
spec:
  group: gitops.monedula.dev
  names:
    kind: KafkaUser
    listKind: KafkaUserList
    plural: kafkausers
    singular: kafkauser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.username
      name: Username
      type: string
    - jsonPath: .spec.mechanism
      name: Mechanism
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KafkaUserSpec carries CEL transition rules (x-kubernetes-validations) that
              enforce identity immutability AT THE APISERVER, so the default install
              (webhooks disabled) cannot silently orphan broker state by renaming identity
              fields. The rules reference oldSelf, so they run only on UPDATE — create is
              unrestricted. username is immutable ONCE SET: an update from unset/empty to
              set is allowed (defaulting resolves username from metadata.name in-memory,
              so making the default explicit later must not be rejected). Note the CEL
              rule cannot compare against metadata.name from spec scope, so unset→set
              admits any value; the webhook (when enabled) additionally rejects an
              unset→set update whose value differs from metadata.name (resolved-name
              comparison). The !has() disjunct is defensive for a future pointer/optional
              refactor of Username; today the field is a plain string, so the
              .size() == 0 disjunct is what fires for never-set values. CEL messages are
              static (no old/new value interpolation) — the webhook supplies the richer
              old -> new messages.
            properties:
              clusterRef:
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                description: |-
                  DeletionPolicy defaults to Delete (see internal/defaulting): the
                  credential is this CR's entire reason to exist, so orphaning it on
                  delete is the unusual case, unlike topics/ACLs.
                enum:
                - Delete
                - Orphan
                type: string
              iterations:
                description: |-
                  Iterations is the SCRAM iteration count. Nil means "use the Kafka broker
                  default" and is NOT drift-compared (an unset value never triggers drift
                  just because the broker reports its own default back).
                format: int32
                maximum: 16384
                minimum: 4096
                type: integer
              mechanism:
                description: Mechanism defaults to SCRAM-SHA-512 when empty (see internal/defaulting).
                enum:
                - SCRAM-SHA-256
                - SCRAM-SHA-512
                type: string
              password:
                description: |-
                  Password is required; validation enforces its presence (kept as a
                  pointer so a missing/malformed block produces a clear shape error
                  rather than a silently-empty struct).
                properties:
                  generate:
                    description: 'GeneratePassword is currently empty (future: length/charset
                      knobs).'
                    type: object
                  valueFrom:
                    properties:
                      configMapKeyRef:
                        description: |-
                          ConfigMapKeyRef reads a ConfigMap key (operator mode only).
                          Uses the same {Name, Key} shape as SecretKeyRef; no Secret is involved.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      env:
                        type: string
                      file:
                        type: string
                      inline:
                        description: Inline is the literal value verbatim (intended
                          for schema bodies).
                        type: string
                      secretKeyRef:
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                type: object
              username:
                description: Username defaults from metadata.name when empty (defaulting
                  webhook / CLI defaulting package).
                type: string
            required:
            - clusterRef
            type: object
            x-kubernetes-validations:
            - message: spec.username is immutable once set (a rename is a delete +
                create of a different principal)
              rule: '!has(oldSelf.username) || oldSelf.username.size() == 0 || (has(self.username)
                && self.username == oldSelf.username)'
            - message: spec.clusterRef.name is immutable (repointing a user orphans
                the previous cluster's credential)
              rule: self.clusterRef.name == oldSelf.clusterRef.name
          status:
            description: KafkaUserStatus is the observed state of a KafkaUser.
            properties:
              appliedPasswordRef:
                description: |-
                  AppliedPasswordRef records the Secret+ResourceVersion whose value was last
                  upserted to Kafka (referenced/valueFrom mode only).
                properties:
                  resourceVersion:
                    type: string
                  secretName:
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              generatedSecretName:
                description: |-
                  GeneratedSecretName is set in generate mode: the name of the
                  operator-owned Secret holding the generated password.
                type: string
              lastAppliedTime:
                format: date-time
                type: string
              lastCheckedTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
