# ConfigMap schema-body watch sample (v0.11, §11.3)
#
# Demonstrates the label-scoped ConfigMap watch: the operator watches ConfigMaps
# carrying the label `gitops.monedula.dev/schema-source: "true"` and reconciles
# the referencing KafkaTopic(s) promptly on a body change, instead of waiting for
# the 5-min periodic resync.
#
# How it works:
#   1. Label the ConfigMap that holds the schema body (see below).
#   2. Reference it from the KafkaTopic via spec.schema.valueSchema.valueFrom.configMapKeyRef.
#   3. Any edit to the ConfigMap key immediately enqueues the topic for reconciliation.
#
# Without the label, body edits are picked up only at the next resync, and the
# topic reports SchemaSourceUnwatched=True (reason: ConfigMapNotLabeled).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-schemas
  namespace: monedula-system
  labels:
    # This label opts the ConfigMap into the operator's label-scoped watch (§11.3).
    # Changes to the keys referenced by any KafkaTopic in the same namespace are
    # picked up immediately rather than at the next periodic resync.
    gitops.monedula.dev/schema-source: "true"
data:
  orders-value.avsc: |
    {
      "type": "record",
      "name": "Order",
      "namespace": "dev.monedula.orders",
      "fields": [
        { "name": "orderId",   "type": "string" },
        { "name": "amount",    "type": "double" },
        { "name": "currency",  "type": "string" },
        { "name": "createdAt", "type": "long", "logicalType": "timestamp-millis" }
      ]
    }
---
apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: orders-events
  namespace: monedula-system
spec:
  clusterRef:
    name: sample-cluster
  topicName: orders.schema-watch.events
  partitions: 6
  replicationFactor: 3
  config:
    retention.ms: "604800000"
    cleanup.policy: delete
  schema:
    format: AVRO
    compatibility: BACKWARD
    # configMapKeyRef references the labelled ConfigMap above (operator mode only).
    # The operator resolves the schema body at reconcile time and registers it with
    # the Schema Registry.  Because the ConfigMap carries the schema-source label,
    # any edit to orders-value.avsc enqueues this topic immediately.
    valueSchema:
      valueFrom:
        configMapKeyRef:
          name: orders-schemas
          key: orders-value.avsc
  reconciliation:
    mode: Enforce
  deletionPolicy: Orphan
