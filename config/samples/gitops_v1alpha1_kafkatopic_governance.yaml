apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: payments-orders-governed
  namespace: team-payments
spec:
  clusterRef:
    name: sample-secure-cluster
  # topicName satisfies the cluster's tenancy topicPrefixes rule for the
  # team-payments namespace (prefix "payments.").
  topicName: payments.orders
  partitions: 6
  replicationFactor: 3
  config:
    retention.ms: "604800000"
    cleanup.policy: delete
  # Governance mode (spec §11.2, §12.2): spec.schema declares compatibility but
  # NO valueSchema/keySchema body. monedula manages ONLY the subject's
  # compatibility level (payments.orders-value); schema versions are registered
  # out-of-band by the producer's pipeline and are NOT treated as drift.
  # valueSchema is optional as of v0.7.
  schema:
    format: AVRO
    compatibility: FULL
  reconciliation:
    mode: Enforce
  # deletionPolicy omitted on purpose: inherits the cluster default
  # (topicDeletionPolicy: Orphan, spec §4.7).
