apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: sample-topic
  namespace: monedula-system
spec:
  clusterRef:
    name: sample-cluster
  topicName: orders.events
  partitions: 6
  replicationFactor: 3
  config:
    retention.ms: "604800000"
    cleanup.policy: delete
  access:
    producers:
    - principal: User:orders-service
      operations:
      - Write
    consumers:
    - principal: User:billing-service
      group: billing-consumers
      topicOperations:
      - Read
      groupOperations:
      - Read
  reconciliation:
    mode: Enforce
  deletionPolicy: Orphan
