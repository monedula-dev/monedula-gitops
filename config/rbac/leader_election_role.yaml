# Permissions needed when --leader-elect is enabled, so a single replica holds
# the lease at a time and the manager can record leader-election events.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monedula-leader-election-role
  namespace: monedula-system
  labels:
    app.kubernetes.io/name: monedula-gitops
    app.kubernetes.io/component: operator
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monedula-leader-election-rolebinding
  namespace: monedula-system
  labels:
    app.kubernetes.io/name: monedula-gitops
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monedula-leader-election-role
subjects:
- kind: ServiceAccount
  name: monedula-manager
  namespace: monedula-system
