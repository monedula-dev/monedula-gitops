apiVersion: v1
kind: Namespace
metadata:
  name: monedula-system
  labels:
    app.kubernetes.io/name: monedula-gitops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monedula-controller-manager
  namespace: monedula-system
  labels:
    app.kubernetes.io/name: monedula-gitops
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: monedula-gitops
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monedula-gitops
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: monedula-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: ghcr.io/monedula-dev/monedula-gitops:0.8.0
        # IfNotPresent so a locally-built image imported into k3d/kind is used
        # instead of being (re-)pulled from a registry, which would fail.
        imagePullPolicy: IfNotPresent
        args:
        - operator
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --leader-elect
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: monedula-controller-manager-metrics
  namespace: monedula-system
  labels:
    app.kubernetes.io/name: monedula-gitops
    app.kubernetes.io/component: operator
spec:
  selector:
    app.kubernetes.io/name: monedula-gitops
    app.kubernetes.io/component: operator
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP
