apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
  namespace: payments
spec:
  clusterRef:
    name: local
  topicName: payments.orders
  partitions: 6
  config:
    retention.ms: "604800000"
  access:
    producers:
      - principal: "User:svc-checkout"
        operations:
          - Write
    consumers:
      - principal: "User:svc-fraud"
        group: fraud-orders
        topicOperations:
          - Read
        groupOperations:
          - Read
  schema:
    format: AVRO
    compatibility: BACKWARD
    valueSchema:
      valueFrom:
        file: ./schemas/orders-value.avsc
  reconciliation:
    mode: Enforce
  deletionPolicy: Orphan
