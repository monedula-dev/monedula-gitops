// JAAS realm used by Schema Registry's HTTP Basic authentication.
// The realm name "SchemaRegistry" must match SCHEMA_REGISTRY_AUTHENTICATION_REALM.
// Credentials are loaded from a Java properties file (see sr-password.properties),
// where each line is:  <user>: <password>,<role>[,<role>...]
//
// NOTE (version-sensitive): the PropertyFileLoginModule package path depends on
// the Jetty version bundled in cp-schema-registry. This file targets the pinned
// cp-schema-registry:8.0.0 image, which ships Jetty 12. If you DOWNGRADE the image
// to a Jetty 9.4-11 build (e.g. cp 7.x) and Basic-auth logins start returning 401,
// swap the class below:
//   Jetty 12+    : org.eclipse.jetty.security.jaas.spi.PropertyFileLoginModule  (used here)
//   Jetty 9.4-11 : org.eclipse.jetty.jaas.spi.PropertyFileLoginModule
SchemaRegistry {
  org.eclipse.jetty.security.jaas.spi.PropertyFileLoginModule required
  file="/etc/schema-registry/secrets/sr-password.properties"
  debug="false";
};
