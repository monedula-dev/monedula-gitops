# DEMO-ONLY credentials. These plaintext values match the in-cluster Kafka +
# Schema Registry from quickstart/k8s/kafka/ (the `admin` SCRAM super-user and
# the `sr` Schema Registry basic-auth user). DO NOT use these values anywhere
# real: in a production cluster, source the Secret from your secrets manager /
# SOPS / External Secrets and never commit credentials to git.
#
# The operator connects as the SCRAM super-user `admin`: it manages topics AND
# ACLs, so it must bypass ACL enforcement. An app user (e.g. `monedula`) would
# lock itself out the moment it creates ACLs on a topic -- with
# allow.everyone.if.no.acl.found=true a resource is open only while it has NO
# ACLs; once the manifest's ACLs exist, any principal not listed loses access.
#
# The KafkaCluster sample references these keys via secretKeyRef; the operator's
# K8sResolver reads this Secret from the resource's own namespace (monedula-demo).
apiVersion: v1
kind: Secret
metadata:
  name: kafka-credentials
  namespace: monedula-demo
  labels:
    app.kubernetes.io/part-of: monedula-quickstart
type: Opaque
stringData:
  kafka-username: admin
  kafka-password: admin-secret
  sr-username: sr
  sr-password: sr-secret
