apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: acl-orders
spec:
  clusterRef:
    name: shared
  topicName: acl.orders
  partitions: 1
  access:
    producers:
      - principal: "User:svc-producer"
        operations:
          - Write
    consumers:
      - principal: "User:svc-consumer"
        group: acl-orders-cg
        topicOperations:
          - Read
        groupOperations:
          - Read
