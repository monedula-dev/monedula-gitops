apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: roundtrip-orders
spec:
  clusterRef:
    name: shared
  topicName: roundtrip.orders
  partitions: 1
  config:
    cleanup.policy: compact
  access:
    producers:
      - principal: "User:svc-rt-prod"
        operations:
          - Write
    consumers:
      - principal: "User:svc-rt-cons"
        group: roundtrip-cg
        topicOperations:
          - Read
        groupOperations:
          - Read
