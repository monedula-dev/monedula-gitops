# Monedula e2e scenario cluster: single-node Kafka (KRaft) with mTLS (SSL client-cert auth).
#
# Security model (DEV ONLY -- certs are intentionally self-signed and fake):
#   - Kafka client traffic uses SSL with mutual TLS (client-cert required) on :9092.
#   - INTERNAL traffic (inter-broker + healthcheck path) is PLAINTEXT on :9094.
#   - ssl.client.auth=required: every client must present a cert signed by the dev CA.
#
# TLS certificate notes:
#   - Dev-only CA, server cert, and client cert live in ./certs/ (generated by ./certs/gen.sh).
#   - The server cert covers SANs: localhost, kafka, host.docker.internal.
#   - Clients must trust ./certs/ca.crt and present ./certs/client.crt + client.key.
#
# PEM keystore (Apache Kafka 3.x / cp-kafka 8.x):
#   ssl.keystore.type=PEM is supported natively. We supply a combined PEM file
#   (server.crt + server.key) as the keystore -- no JKS/PKCS12 conversion needed.
#   The configure.sh pre-check in the cp-kafka image only fires when ADVERTISED_LISTENERS
#   contains the literal string "SSL://"; since our names are CLIENT_HOST/INTERNAL/CONTROLLER,
#   that check is skipped, and the KAFKA_SSL_* env vars are passed through to the broker
#   unchanged.

services:
  kafka:
    image: confluentinc/cp-kafka:8.0.0
    hostname: kafka
    container_name: monedula-mtls-kafka
    ports:
      - "9092:9092"   # CLIENT_HOST (SSL, mutual TLS) -- host CLI connects here
      - "9097:9097"   # CLIENTKIND (SSL, mutual TLS) -- in-kind operator connects here
    environment:
      # --- KRaft single-node (broker + controller in one process) ---
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      # --- Listeners ---
      # CONTROLLER  : KRaft quorum (PLAINTEXT, internal only)
      # INTERNAL    : inter-broker + healthcheck admin path (PLAINTEXT)
      # CLIENT_HOST : host-facing SSL listener with mutual TLS, advertised as localhost:9092
      # CLIENTKIND  : in-kind operator SSL listener, advertised as host.docker.internal:9097
      # CLIENTKIND (no underscore, unlike shared-sasl's CLIENT_KIND): the
      # auth-oauth/auth-mds profiles require a no-underscore listener name for
      # their per-listener config keys; the three auth profiles use the same
      # name for consistency.
      KAFKA_LISTENERS: "CONTROLLER://:9093,INTERNAL://:9094,CLIENT_HOST://:9092,CLIENTKIND://:9097"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9094,CLIENT_HOST://localhost:9092,CLIENTKIND://host.docker.internal:9097"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,CLIENT_HOST:SSL,CLIENTKIND:SSL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # --- Authorization ---
      # StandardAuthorizer enables ACL listing (required by the CLI's computeOps
      # path). With mTLS the client principal is derived from the cert DN
      # (e.g. User:CN=monedula). ALLOW_EVERYONE_IF_NO_ACL_FOUND=true means the
      # broker grants access to any operation not explicitly ACL-restricted, so
      # the CLI can create topics and list ACLs without pre-provisioning ACL entries.
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      KAFKA_SUPER_USERS: "User:CN=monedula"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"

      # --- TLS (PEM keystore, Apache Kafka 3.x / cp-kafka 8.x) ---
      # ssl.keystore.type=PEM lets us supply cert+key as PEM files without JKS conversion.
      # The keystore file is a combined PEM containing the server cert + private key.
      # No keystore password is needed for unencrypted PEM keys.
      KAFKA_SSL_KEYSTORE_TYPE: "PEM"
      KAFKA_SSL_KEYSTORE_LOCATION: "/etc/kafka/secrets/server-keystore.pem"
      # Truststore holds the dev CA; the broker uses it to verify client certs.
      KAFKA_SSL_TRUSTSTORE_TYPE: "PEM"
      KAFKA_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/secrets/certs/ca.crt"
      # mutual TLS: every connecting client must present a cert signed by the dev CA.
      KAFKA_SSL_CLIENT_AUTH: "required"

      # --- Misc single-node tuning ---
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka-data:/var/lib/kafka/data
      # TLS cert material (DEV ONLY).
      # gen.sh produces ca.crt + server.crt + server.key + client.crt + client.key.
      # We combine cert+key into server-keystore.pem via the entrypoint wrapper below.
      - ./certs:/etc/kafka/secrets/certs:ro
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        # Combine server cert + key into a PEM keystore for Kafka's ssl.keystore.location.
        cat /etc/kafka/secrets/certs/server.crt /etc/kafka/secrets/certs/server.key \
          > /etc/kafka/secrets/server-keystore.pem
        chmod 600 /etc/kafka/secrets/server-keystore.pem
        exec /etc/confluent/docker/run
    healthcheck:
      # Probe over the INTERNAL plaintext listener -- no auth or TLS needed.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9094"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  kafka-data:
