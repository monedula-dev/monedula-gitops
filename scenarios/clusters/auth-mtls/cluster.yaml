# KafkaCluster CR for CLI mode (docker compose) with mTLS (SSL client-cert auth).
#
# The broker requires every client to present a certificate signed by the dev CA
# (ssl.client.auth=required). The client cert and key are loaded from ./certs/
# (generated by ./certs/gen.sh), and the CLI verifies the broker's server cert
# against the same dev CA via tls.caCert (a file ref, resolved relative to this
# cluster-config file — same as clientCert/clientKey).
apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaCluster
metadata:
  name: shared
spec:
  bootstrapServers: localhost:9092
  tls:
    enabled: true
    caCert:     { valueFrom: { file: certs/ca.crt } }
    clientCert: { valueFrom: { file: certs/client.crt } }
    clientKey:  { valueFrom: { file: certs/client.key } }
  auth:
    mechanism: mTLS
