// Broker-side JAAS configuration for SASL_PLAINTEXT / OAUTHBEARER (DEV ONLY).
//
// The KafkaServer stanza enables the OAUTHBEARER mechanism on the CLIENTHOST
// listener. The broker validates incoming tokens using the OAuthBearerValidatorCallbackHandler
// (configured via KAFKA_LISTENER_NAME_CLIENTHOST_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS)
// against the mock OIDC server's JWKS endpoint.
//
// No client credentials are needed here — the broker itself does not use
// client_credentials to authenticate outbound (inter-broker is PLAINTEXT).
KafkaServer {
    org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;
};
