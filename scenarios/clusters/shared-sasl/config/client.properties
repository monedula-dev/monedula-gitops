# Client config for the bundled native Kafka CLI tools (kafka-topics,
# kafka-configs, kafka-console-producer/consumer, kafka-acls, ...).
#
# DEMO ONLY -- credentials are fake. Connects as the SCRAM super-user `admin`
# over the SASL_PLAINTEXT / SCRAM-SHA-512 client listener, so listings always
# show every topic regardless of ACLs. (Swap to monedula/monedula-secret to see
# the cluster as an ACL-restricted app user -- topics whose ACLs don't include
# `monedula` disappear from --list.)
#
# Usage from inside the broker container (no host install needed):
#   docker compose exec kafka kafka-topics \
#     --bootstrap-server localhost:9092 \
#     --command-config /etc/kafka/secrets/client.properties --list
#
# Usage from the host (requires Kafka CLI tools installed):
#   kafka-topics --bootstrap-server localhost:9092 \
#     --command-config quickstart/cli/config/client.properties --list

security.protocol=SASL_PLAINTEXT
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="admin-secret";
