// JAAS realm used by Schema Registry's HTTP Basic authentication.
// The realm name "SchemaRegistry" must match SCHEMA_REGISTRY_AUTHENTICATION_REALM.
// Credentials are loaded from a Java properties file (see sr-password.properties),
// where each line is:  <user>: <password>,<role>[,<role>...]
//
// NOTE (version-sensitive): this is the Jetty 9.4-11 sibling of
// schema-registry-jaas.conf, for matrix cells whose cp-schema-registry image
// is on the Confluent Platform 7.x line (e.g. cp-7.6, cp-7.9). Those images
// bundle Jetty 9.4-11, where PropertyFileLoginModule lives one package level
// up from the Jetty 12 path used by cp 8.x. Loading the wrong class path
// against a given image makes Schema Registry's Basic auth fail every
// request with 401, including correct credentials.
//   Jetty 12+    : org.eclipse.jetty.security.jaas.spi.PropertyFileLoginModule
//   Jetty 9.4-11 : org.eclipse.jetty.jaas.spi.PropertyFileLoginModule  (used here)
// This file is wired in via the "jetty9" compose overlay
// (compose.jetty9.yaml), applied for cells that declare it in
// internal/matrix/versions.yaml's `overlays` list.
SchemaRegistry {
  org.eclipse.jetty.jaas.spi.PropertyFileLoginModule required
  file="/etc/schema-registry/secrets/sr-password.properties"
  debug="false";
};
