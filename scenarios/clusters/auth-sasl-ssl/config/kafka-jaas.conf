// Broker-side JAAS for the SASL/SCRAM client listeners (CLIENT_HOST, CLIENT_DOCKER).
//
// Even though the inter-broker + controller listeners are PLAINTEXT, the broker
// still needs a KafkaServer JAAS entry to *enable* the SASL listeners it hosts.
// For SCRAM the broker validates client logins against its own credential store
// (populated by kafka-init), so NO username/password is needed here -- the entry
// only needs to declare the ScramLoginModule. A single global "KafkaServer" entry
// applies to all SASL listeners.
KafkaServer {
  org.apache.kafka.common.security.scram.ScramLoginModule required;
};
