# Client config for the bundled native Kafka CLI tools when connecting to the
# SASL_SSL listener on this profile.
#
# DEMO ONLY -- credentials are fake. Connects as the SCRAM super-user `admin`
# over the SASL_SSL / SCRAM-SHA-512 client listener.
# ssl.endpoint.identification.algorithm= disables hostname verification -- safe
# for the dev cert but never use this in production.
#
# Usage from inside the broker container (no host install needed):
#   docker compose exec kafka kafka-topics \
#     --bootstrap-server localhost:9092 \
#     --command-config /etc/kafka/secrets/client.properties --list

security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="admin-secret";
ssl.endpoint.identification.algorithm=
ssl.truststore.type=PEM
ssl.truststore.location=/etc/kafka/secrets/certs/ca.crt
