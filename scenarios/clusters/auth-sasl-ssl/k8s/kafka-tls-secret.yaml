# DEV-ONLY TLS Secret for the auth-sasl-ssl scenario cluster.
#
# This manifest is a template: apply it AFTER replacing <BASE64_...> placeholders
# with the base64-encoded PEM content from scenarios/clusters/auth-sasl-ssl/certs/.
# The CA private key (ca.key) is deliberately NOT included in any Secret — the
# broker terminates TLS with server.crt + server.key and never reads the CA key.
#
#   kubectl -n kafka create secret generic kafka-tls \
#     --from-file=ca.crt=scenarios/clusters/auth-sasl-ssl/certs/ca.crt \
#     --from-file=server.crt=scenarios/clusters/auth-sasl-ssl/certs/server.crt \
#     --from-file=server.key=scenarios/clusters/auth-sasl-ssl/certs/server.key
#
# Alternatively apply this manifest directly (with real base64 values substituted),
# or use `kubectl create secret` as shown above for CI pipelines.
---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-tls
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka-tls
    app.kubernetes.io/part-of: monedula-e2e
# NOTE: Replace <BASE64_...> with the actual base64-encoded PEM content.
# base64 -w0 < certs/ca.crt  etc.
data:
  ca.crt: <BASE64_CA_CRT>
  server.crt: <BASE64_SERVER_CRT>
  server.key: <BASE64_SERVER_KEY>
---
# kafka-ca Secret: used by the monedula-gitops operator to resolve tls.caCert
# (spec: KafkaCluster.spec.tls.caCert.valueFrom.secretKeyRef = {name: kafka-ca, key: ca.crt}).
apiVersion: v1
kind: Secret
metadata:
  name: kafka-ca
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka-ca
    app.kubernetes.io/part-of: monedula-e2e
data:
  ca.crt: <BASE64_CA_CRT>
