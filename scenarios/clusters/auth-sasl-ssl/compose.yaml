# Monedula e2e scenario cluster: single-node Kafka (KRaft) with SASL_SSL / SCRAM-SHA-512.
#
# Security model (DEV ONLY -- certs and credentials are intentionally fake):
#   - Kafka client traffic uses SASL_SSL (SCRAM-SHA-512 over TLS) on :9092.
#   - INTERNAL traffic (inter-broker + SCRAM bootstrap) is PLAINTEXT on :9094.
#   - Schema Registry is NOT included in this profile (no seed scenario requires it).
#     Use the shared-sasl profile if you need Schema Registry.
#
# TLS certificate notes:
#   - Dev-only CA and server cert live in ./certs/ (generated by ./certs/gen.sh).
#   - The server cert covers SANs: localhost, kafka, kafka.kafka.svc.cluster.local,
#     host.docker.internal (the last so the in-kind operator can verify the CLIENTKIND
#     listener advertised at host.docker.internal:9100 under tls.caCert).
#   - Clients must trust ./certs/ca.crt (wired via tls.caCert in the cluster CRs).
#
# SCRAM bootstrap deadlock avoidance:
#   Same pattern as shared-sasl: the internal PLAINTEXT listener (:9094) is used
#   by kafka-init to create the SCRAM users before the SASL_SSL listener (:9092)
#   becomes usable by clients. This avoids the deadlock of needing a SCRAM user to
#   create the first SCRAM user.
#
# PEM keystore (Apache Kafka 3.x / cp-kafka 8.x):
#   ssl.keystore.type=PEM is supported natively. We supply a combined PEM file
#   (server.crt + server.key) as the keystore -- no JKS/PKCS12 conversion needed.
#   The configure.sh pre-check in the cp-kafka image only fires when ADVERTISED_LISTENERS
#   contains the literal string "SSL://"; since our names are CLIENT_HOST/INTERNAL/CONTROLLER,
#   that check is skipped, and the KAFKA_SSL_* env vars are passed through to the broker
#   unchanged.

services:
  kafka:
    image: confluentinc/cp-kafka:8.0.0
    hostname: kafka
    container_name: monedula-sasl-ssl-kafka
    ports:
      - "9092:9092"   # CLIENT_HOST (SASL_SSL) -- host CLI connects here
      - "9100:9100"   # CLIENTKIND (SASL_SSL) -- in-kind operator connects here
    environment:
      # --- KRaft single-node (broker + controller in one process) ---
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      # --- Listeners ---
      # CONTROLLER  : KRaft quorum (PLAINTEXT, internal only)
      # INTERNAL    : inter-broker + kafka-init admin path (PLAINTEXT)
      # CLIENT_HOST : host-facing SASL_SSL listener, advertised as localhost:9092
      # CLIENTKIND  : in-kind operator SASL_SSL listener, advertised as host.docker.internal:9100
      # No per-listener SASL or SSL keys needed: global SCRAM + top-level KAFKA_SSL_* cover both SASL_SSL listeners.
      KAFKA_LISTENERS: "CONTROLLER://:9093,INTERNAL://:9094,CLIENT_HOST://:9092,CLIENTKIND://:9100"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9094,CLIENT_HOST://localhost:9092,CLIENTKIND://host.docker.internal:9100"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,CLIENT_HOST:SASL_SSL,CLIENTKIND:SASL_SSL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # --- SASL / authorization ---
      KAFKA_SASL_ENABLED_MECHANISMS: "SCRAM-SHA-512"
      # Broker-side JAAS: enables the SASL listener (no username/password needed;
      # client logins are validated against the SCRAM credential store).
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka-jaas.conf"
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      KAFKA_SUPER_USERS: "User:admin"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"

      # --- TLS (PEM keystore, Apache Kafka 3.x / cp-kafka 8.x) ---
      # ssl.keystore.type=PEM lets us supply cert+key as PEM files without JKS conversion.
      # The keystore file is a combined PEM containing the server cert + private key.
      # No keystore password is needed for unencrypted PEM keys.
      KAFKA_SSL_KEYSTORE_TYPE: "PEM"
      KAFKA_SSL_KEYSTORE_LOCATION: "/etc/kafka/secrets/server-keystore.pem"
      # No client-cert requirement (client proves identity via SCRAM, not mTLS).
      KAFKA_SSL_CLIENT_AUTH: "none"

      # --- Misc single-node tuning ---
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./config/kafka-jaas.conf:/etc/kafka/secrets/kafka-jaas.conf:ro
      - ./config/client.properties:/etc/kafka/secrets/client.properties:ro
      # TLS cert material (DEV ONLY).
      # gen.sh produces ca.crt + server.crt + server.key; we combine cert+key into
      # server-keystore.pem via the entrypoint wrapper below.
      - ./certs:/etc/kafka/secrets/certs:ro
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        # Combine server cert + key into a PEM keystore for Kafka's ssl.keystore.location.
        cat /etc/kafka/secrets/certs/server.crt /etc/kafka/secrets/certs/server.key \
          > /etc/kafka/secrets/server-keystore.pem
        chmod 600 /etc/kafka/secrets/server-keystore.pem
        exec /etc/confluent/docker/run
    healthcheck:
      # Probe over the INTERNAL plaintext listener -- no auth needed.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9094"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # One-shot job: create the SCRAM users over the PLAINTEXT internal listener.
  kafka-init:
    image: confluentinc/cp-kafka:8.0.0
    container_name: monedula-sasl-ssl-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        kafka-configs --bootstrap-server kafka:9094 --alter \
          --add-config 'SCRAM-SHA-512=[password=admin-secret]' \
          --entity-type users --entity-name admin
        kafka-configs --bootstrap-server kafka:9094 --alter \
          --add-config 'SCRAM-SHA-512=[password=monedula-secret]' \
          --entity-type users --entity-name monedula
        echo "SCRAM users created"

volumes:
  kafka-data:
