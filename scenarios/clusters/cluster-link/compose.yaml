# Monedula e2e scenario cluster: two single-node KRaft Confluent Server
# (cp-server 8.3.1) clusters joined by a destination-side cluster link.
#
#   source  - the cluster mirror topics read from (no auth, no authorizer).
#   dest    - the cluster the product manages: KafkaMirrorTopic resources are
#             created here through the embedded Kafka REST v3 API on :8090.
#   link-setup - one-shot: creates the source topics, a dest-only normal topic
#             (for the name-collision case), and the src-to-dest link.
#
# DEV ONLY: PLAINTEXT everywhere, no credentials. Cluster linking needs no
# license key (confluent.cluster.link.enable defaults to true); single-node
# brokers need replication factor 1 for every Confluent internal topic.
#
# Host ports: source Kafka localhost:19092, dest Kafka localhost:29092,
# dest REST http://localhost:8090/kafka (the client appends /v3).
# In-network: source:9092, dest:9092.
#
# The cp-server 8.x image ships no curl/wget, so healthchecks use python3 or the
# Kafka CLI tools.

x-common-env: &common-env
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_NODE_ID: "1"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_CONFLUENT_METADATA_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_CONFLUENT_DURABILITY_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_CONFLUENT_TIER_METADATA_REPLICATION_FACTOR: "1"
  KAFKA_CONFLUENT_REPORTERS_TELEMETRY_AUTO_ENABLE: "false"
  KAFKA_CONFLUENT_TELEMETRY_ENABLED: "false"
  KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: "false"

services:
  source:
    image: ${MONEDULA_KAFKA_IMAGE:-confluentinc/cp-server:8.3.1}
    container_name: monedula-cl-source
    hostname: source
    ports:
      - "19092:19092"
    environment:
      <<: *common-env
      CLUSTER_ID: "c291cmNlLWNsdXN0ZXItMQ"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@source:9093"
      KAFKA_LISTENERS: "CONTROLLER://:9093,INTERNAL://:9092,HOST://:19092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://source:9092,HOST://localhost:19092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 60

  dest:
    image: ${MONEDULA_KAFKA_IMAGE:-confluentinc/cp-server:8.3.1}
    container_name: monedula-cl-dest
    hostname: dest
    ports:
      - "29092:29092"
      - "8090:8090"
    environment:
      <<: *common-env
      CLUSTER_ID: "ZGVzdC1jbHVzdGVyLTAwMQ"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@dest:9093"
      KAFKA_LISTENERS: "CONTROLLER://:9093,INTERNAL://:9092,HOST://:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://dest:9092,HOST://localhost:29092"
      # Embedded Kafka REST v3, served under /kafka/v3 on the Confluent HTTP server.
      KAFKA_CONFLUENT_HTTP_SERVER_LISTENERS: "http://0.0.0.0:8090"
      KAFKA_KAFKA_REST_ENABLE: "true"
      # An authorizer is needed only so ACL reads (doctor's acl-read check) do
      # not fail with SECURITY_DISABLED. PLAINTEXT clients are User:ANONYMOUS.
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      KAFKA_SUPER_USERS: "User:ANONYMOUS"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/kafka/v3/clusters', timeout=5)"]
      interval: 3s
      timeout: 10s
      retries: 60

  link-setup:
    image: ${MONEDULA_KAFKA_IMAGE:-confluentinc/cp-server:8.3.1}
    container_name: monedula-cl-setup
    restart: "no"
    depends_on:
      source: {condition: service_healthy}
      dest: {condition: service_healthy}
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        kafka-topics --bootstrap-server source:9092 --create --topic orders \
          --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server source:9092 --create --topic payments \
          --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server dest:9092 --create --topic ledger \
          --partitions 1 --replication-factor 1
        printf 'bootstrap.servers=source:9092\n' > /tmp/link.properties
        kafka-cluster-links --bootstrap-server dest:9092 --create --link src-to-dest \
          --config-file /tmp/link.properties
        kafka-cluster-links --bootstrap-server dest:9092 --list
