// DEV ONLY — JAAS config for Confluent Server (cp-server) with LDAP-backed
// SASL/PLAIN authentication on the client listener.
//
// The KafkaServer section enables the PLAIN mechanism on the CLIENTHOST listener.
// Actual credential validation is delegated to the LDAP callback handler
// (configured via KAFKA_LISTENER_NAME_CLIENTHOST_PLAIN_SASL_SERVER_CALLBACK_HANDLER_CLASS).
// No static usernames/passwords are stored here.
KafkaServer {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="kafka-admin"
    password="kafka-admin-secret";
};
