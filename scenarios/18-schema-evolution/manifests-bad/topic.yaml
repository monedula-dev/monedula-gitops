apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: schema-evo
spec:
  clusterRef:
    name: shared
  topicName: schema.evo
  partitions: 1
  schema:
    format: AVRO
    compatibility: BACKWARD
    valueSchema:
      valueFrom:
        inline: '{"type":"record","name":"SchemaEvo","fields":[{"name":"id","type":"string"}]}'
