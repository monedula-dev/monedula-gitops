apiVersion: gitops.monedula.dev/v1alpha1
kind: KafkaTopic
metadata:
  name: schema-demo
spec:
  clusterRef:
    name: shared
  topicName: schema.demo
  partitions: 1
  schema:
    format: AVRO
    compatibility: BACKWARD
    valueSchema:
      valueFrom:
        inline: '{"type":"record","name":"SchemaDemo","fields":[{"name":"id","type":"long"}]}'
